<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guesser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="heading">Number Guessor</div>
    <div id="description">The number would be between 1 to 100. You have 10 attempts to guess the right number</div>
    <div id="screen">
        <button id="start">Start</button>
    </div>
    <div id="main">
        <label for="input" style="margin: 5px">Guess the number:</label>
        <input type="number" id="input">
        <button id="guessbtn">Guess</button>
    </div>
    <footer>
    <button id="reset">Reset</button>
    </footer>
    <script src="script.js"></script>
</body>
</html>
